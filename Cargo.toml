[package]
name = "rudder"
version = "0.8.1-fix1"
edition = "2024"
authors = ["Rudder contributors"]
description = "A lightweight FinalShell-style SSH/terminal client written in Rust + Slint"
license = "MIT OR Apache-2.0"
repository = "https://github.com/your/rudder"
readme = "README.md"
rust-version = "1.96"

[dependencies]
# unstable-fontique-011: runtime font registration (user fonts dropped into
# <config>/fonts are loaded at startup instead of being embedded at build
# time — avoids the ~80 MB Maple Mono embed while keeping it optional).
# 1.18 把该 feature 从 -010 改名为 -011（fontique 0.10 → 0.11），模块路径同步。
#
# ⚠️ 升级 slint 版本时**必须**同时 `cargo update -p const-field-offset`：
# 1.18 的代码生成会发出 `sp::compose_field_offsets(..)`，而它只存在于
# const-field-offset 0.2.1+；但 i-slint-core 只声明 `^0.2.0`，Cargo 会保留
# 锁文件里的 0.2.0 —— 于是生成的 app.rs 里 137 处调用全部 "cannot find
# function 'compose_field_offsets' in module 'sp'"（2026-09-18 实测，
# 升 1.18.0 时踩到；单跑这一条 update 即解决）。
# 渲染器矩阵（三平台一致）：软件渲染 + `renderer-femtovg-wgpu`（FemtoVG 走 wgpu：
#   Windows=D3D12 / Linux=Vulkan / macOS=Metal）。后者会让 Slint 自己的自动回退链
#   **不再包含 OpenGL 版 FemtoVG**；我们不依赖那条链 —— Windows / Linux 的「自动」由
#   启动时的子进程探测固化成具体取值（见 src/app/window.rs），macOS 默认即 GPU 档。
#
# 后端优先级由 `WGPU_BACKEND` 在 main 启动期定死（见 src/main.rs 的
#   `prefer_platform_gpu_backends`）：Windows=DX12→OpenGL、Linux=Vulkan→OpenGL、
#   macOS=Metal→OpenGL。wgpu 30 没有 DX11 后端，且它的枚举顺序编译期固定（Windows 上
#   默认 Vulkan 排在 DX12 前），所以 DX12 优先只能靠"把 Vulkan 排除"实现 —— 代价与
#   逃生口见那处注释。
#
# ⚠️ 这里**刻意**关掉 Slint 的默认特性：默认集里的 `renderer-femtovg` 就是 OpenGL 版
#   FemtoVG，而本项目已不再使用 OpenGL（GPU 路径一律走 wgpu）。下面这份清单 = Slint 1.18
#   的默认集**减掉** `renderer-femtovg`、**再减掉 `system-tray`**（全项目零调用），逐项照抄
#   对齐上游默认值；`backend-default` 仍然带 winit（x11 + wayland）。
#
# unstable-wgpu-30：`slint::wgpu_30`（wgpu 30 的类型再导出）只在这个 feature 下存在。
#   "自动"档的探测要用它枚举适配器，判断机器上有没有**真的** GPU（见 src/app/window.rs）。
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "unstable-fontique-011",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-30",
] }
# 探测进程里把 wgpu 的异步 future（`enumerate_adapters`）跑完用。它本来就在依赖树里
# （wgpu 自己用的），所以加上它不增加编译量。
pollster = "1"
# ICU4X (pulled in by Slint's text layout) spams stderr with raw `eprintln!`
# ("ICU4X data error: No segmentation model for language: ja") because its
# `log` shim falls back to eprintln when the `logging` feature is off. Turning
# `logging` on routes those through the real `log` crate 鈫?our tracing
# subscriber, where init_tracing silences the `icu_provider` target.
icu_provider = { version = "2", features = ["logging"] }
# Direct access to the winit window/events (OS file-drop for drag-and-drop upload).
i-slint-backend-winit = "1.18"
# Raw HWND access (matches winit's rwh 0.6) for the Win11 rounded-corner + shadow
# DWM tweaks on the frameless window (#162 / #166). Only used under cfg(windows).
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
glob = "0.3"
# 快速字节搜索：ingest 用 memchr 先判断"这块里有没有 ESC"，好让没有转义的普通输出
# （终端流量的绝大多数）跳过留存、反向扫描与逐字节状态机。本就在依赖树里。
memchr = "2"
# 字体文件用 mmap 注册（而不是读进堆）：用户字体目录里是 20MB 级的 CJK 字体，几个就近
# 100MB —— 读进堆会整份常驻。memmap2 本来就在依赖树里（零编译代价）。
memmap2 = "0.9"
anyhow = "1"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = { version = "0.39", default-features = false, features = ["disk", "network", "system"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "time", "fs"] }
# Pinned to 0.49: RUSTSEC-2026-0154 (an unbounded-allocation DoS in russh's
# ssh-AGENT frame parsing) is fixed only in >= 0.60.3, which drags in pre-release
# crypto crates (ed25519-dalek 3.0.0-pre, aes-gcm 0.11.0-rc, 鈥?. Rudder never
# uses the ssh-agent, so the advisory is not reachable here 鈥?see audit.toml.
# Revisit the upgrade once russh's deps leave the -rc channel (cf. PR #151).
# 固定在 0.49：0.50~0.60.3 会引入 pageant ^0.2（windows 0.62，能去掉 0.58 副本），
# 但整条 RustCrypto 新栈是预发布版（aead 0.6-rc、rsa 0.10-rc、ed25519-dalek 3.0-pre、
# p256 0.14-rc 等 20 个），认证与签名路径不采用 rc。0.61+ 还额外要求 ssh-key 0.7.0-rc。
# 结论：等 ssh-key 0.7 与这批 RustCrypto 转正后再一次性升级。
russh = "0.49"
ssh-key = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 直接取 OS 随机数：rand 0.10 已移除 OsRng，我们只需要系统熵源。
getrandom = "0.4"
async-trait = "0.1"
futures = "0.3"
# Full xterm-compatible terminal emulator (replaces vt100): Term + Grid +
# native scrollback/reflow/selection, fed via vte::ansi::Processor.
alacritty_terminal = "0.26"
portable-pty = "0.9"
# East Asian width detection for terminal copy/find column math. Version is
# shared with alacritty_terminal's own dependency so "is this glyph 2 cells
# wide?" agrees with how the grid lays CJK glyphs (#132).
unicode-width = "0.2"
# Split terminal output into complete emoji grapheme clusters (ZWJ sequences,
# flags, skin tones, variation selectors) before replacing them with images.
unicode-segmentation = "1.12"
# Slint's software/femtovg text rasterizers flatten color-font glyphs to a
# monochrome mask. Embedded 72px Twemoji PNGs keep emoji colored on every
# renderer without switching the whole Windows application to Skia (#269).
twemoji-assets = { version = "1.5", default-features = false, features = ["png"] }
russh-sftp = "2.4"
ring = "0.17"
# In-app self-update from GitHub Releases (#self-update).
# No progress-bar / default features: progress is surfaced in our own UI.
# 解压与重启自己实现（原先借 self_update，但它强制要求 HTTP 客户端特性，
# 会把 reqwest 0.13 + aws-lc-sys 重新拉进来，破坏单份 reqwest 的目标）。
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tempfile = "3"
self-replace = "1"
rfd = "0.17"
arboard = "3"
# Zeroes password buffers on drop so plaintext credentials don't linger in
# freed heap memory (core dumps / debuggers / /proc/pid/mem).
zeroize = "1"
# SOCKS5 proxy tunnelling for SSH/SFTP in network-restricted environments.
# (HTTP CONNECT proxies are handled in src/proxy.rs without an extra crate.)
tokio-socks = "0.5"
base64 = "0.23"
# Native PuTTY PPK v2/v3 private-key loading (#281). Conversion stays entirely
# in memory: AES-CBC decrypts encrypted key blobs, Argon2 handles PPKv3 key
# derivation, and HMAC verifies the file before it reaches the SSH parser.
aes = "0.9"
argon2 = "0.6"
cbc = "0.2"
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
# FinalShell connection exports derive a DES key with MD5 using java.util.Random
# (upstream 8a81341); encoding_rs handles legacy GBK-encoded passwords.
des = "0.9"
md5 = "0.8"
encoding_rs = "0.8"
# Enumerate installed system fonts for the Interface (font) settings picker.
fontdb = "0.24"
# Cross-platform serial port access for the Serial session type (#14, #17).
# Opens COM3 / /dev/ttyUSB0 etc.; on Linux the default `libudev` feature is
# used for port enumeration (CI installs libudev-dev).
serialport = "4"
# ChaCha20-Poly1305 AEAD for encrypting passwords at rest in sessions.json.
# base64 由其它依赖带入；系统熵源见上面的 getrandom。
chacha20poly1305 = "0.11"
# Detect whether the OS is running in dark or light mode.
# Used on startup to honour the system preference before the user overrides it.
dark-light = "3"
# 更新器与 WebDAV 的 HTTP 栈：blocking + rustls（含平台根证书）+ HTTP/2。
# WebDAV 的证书指纹固定需要自定义校验器，经 reqwest 的 use_preconfigured_tls 注入。
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking", "rustls-tls-native-roots", "http2", "gzip",
] }

# Image decoding: custom wallpapers (PNG/JPEG/WebP/BMP) for the immersive theme,
# and the embedded PNG window icon on Linux. On Windows the icon comes from the
# .ico embedded by winresource at link time; on macOS from the app bundle.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

# ── macOS：把设置窗口的「最小化(黄) / 缩放(绿)」两个原生按钮隐藏掉，只留关闭(红) ──
# Slint 与 winit 0.30 都没暴露这个开关（`maximizable` 在 winit 里只是 X11 内部按
# `resizable` 派生出来的），只能拿到底层 `NSWindow` 调 AppKit。
# 这两个依赖本来就在依赖树里（winit 带进来的），所以不增加编译量，二进制也不会变大。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# 自更新选包要读本地 glibc 版本：主力 Linux 构建跑在 Ubuntu 24.04（glibc 2.39），
# 老发行版得拿 `-glibc228` 变体，选错则替换后起不来。
# 版本已在依赖树里（alacritty_terminal 等传递引入），这里只是提升为直接依赖。
libc = "0.2"

# Native Wayland clipboard (wlr-data-control protocol) so copy/paste works on
# Wayland sessions (KDE/wlroots) without relying on XWayland (issue #47).
# Feature is additive over the base `arboard = "3"` dependency above.
arboard = { version = "3", features = ["wayland-data-control"] }

# 渲染器矩阵（实验）：三平台**只用两套渲染器** —— 软件渲染（slint 默认）+ femtovg-wgpu
# （主依赖里）。Skia 已整体下架：它在 Windows 上有历史链接坑（与 ICU 导入库在 MSVC 链接期
# 冲突，#224），而体积与构建成本换不来这个项目需要的收益（终端场景以文字为主，实测它与
# femtovg 的内存占用相当）。界面上因此只剩"GPU / 软件"两档。

[build-dependencies]
slint-build = "1.18"

# Embeds assets/rudder.ico into the .exe so Explorer / taskbar / shortcuts
# show the app icon. Windows-only; ignored on other targets.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3                # Speed: our code (Slint animations, terminal rendering)
lto = "fat"                  # Fat LTO: maximum dead-code & cross-crate optimisation
codegen-units = 1            # Single CGU: best optimisation
strip = true                  # Strip symbols + debuginfo (max size reduction)
panic = "abort"              # No unwinding tables
overflow-checks = false

# Dependencies: size-optimized to shrink the binary
[profile.release.package."*"]
opt-level = "s"

# Keep animation-critical deps fast
[profile.release.package.slint]
opt-level = 3
[profile.release.package.slint-build]
opt-level = 3
[profile.release.package.i-slint-backend-winit]
opt-level = 3
[profile.release.package.alacritty_terminal]
opt-level = 3

# ── Profiling (phase-3 flame graphs) ─────────────────────────────────────────
# `cargo build --profile profiling` produces a binary that behaves exactly like
# the release build (same LTO / codegen-units / opt-level) but keeps debug
# symbols, which `strip = true` would otherwise remove — without them every
# frame in a flame graph reads `[unknown]`.
#
#   cargo build --profile profiling
#   samply record ./target/profiling/rudder
#
# Do NOT profile the default `release` binary: it is stripped on purpose.
[profile.profiling]
inherits = "release"
debug = 2
strip = false

[profile.dev]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 2               # Dependencies with light optimisation (faster test builds)
