[package]
name = "meatshell-android"
version = "0.7.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
russh = "0.49"
ssh-key = "0.6"
slint = { version = "=1.16.1", features = ["backend-android-activity-06", "renderer-software"] }
strip-ansi-escapes = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[build-dependencies]
slint-build = "=1.16.1"

[package.metadata.android]
package = "io.github.yituorou.meatshell"
apk_name = "meatshell"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 23
target_sdk_version = 35

[package.metadata.android.application]
label = "MeatShell Beta"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
panic = "abort"
