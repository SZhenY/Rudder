# cargo-audit configuration (https://rustsec.org).
#
# RUSTSEC-2026-0154（russh < 0.60.3，ssh-agent 帧解析的无界分配）曾在这里被忽略：
# 我们不用 agent，且升级会拖入整条预发布加密栈。现在 russh 已升到 0.65.0，
# 该 advisory 不再命中，忽略项随之删除。
#
# 当前已知的预发布依赖（有意接受，不是遗漏）：
#   ssh-key 0.7.0-rc.11、rsa 0.10.0-rc.18、pkcs1 0.8.0-rc.4 —— 由 russh 0.65 精确 pin，
#   无法在不放弃 RSA 的前提下绕开；理由与取舍写在 Cargo.toml 的 russh 注释里。
#
# 若将来出现新的 advisory，不要直接 ignore：先在 Cargo.toml 注释放结论与依据。
[advisories]
ignore = []
