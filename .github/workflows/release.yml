name: Release

# Build native binaries for Windows / Linux / macOS.
#  - Push a tag like `v0.2.3`  -> builds all platforms and attaches the archives
#    to a GitHub Release.
#  - Run manually (workflow_dispatch) -> builds all platforms and uploads them as
#    downloadable workflow artifacts (no release created).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create / update the GitHub Release

jobs:
  check-version:
    name: Check tag version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure tag matches Cargo package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          LOCK_VERSION="$(awk '
            $0 == "name = \"rudder\"" { found = 1; next }
            found && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.lock)"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}."
            echo "Run: pwsh ./scripts/release.ps1 ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$LOCK_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.lock rudder version ${LOCK_VERSION}."
            echo "Run: pwsh ./scripts/release.ps1 ${GITHUB_REF_NAME}"
            exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
            bin: rudder.exe
          - os: ubuntu-22.04            # build on the oldest supported runner for
            target: x86_64-unknown-linux-gnu   # broader glibc compatibility
            name: linux-x86_64
            bin: rudder
          - os: ubuntu-22.04-arm       # free native arm64 runner (public repos)
            target: aarch64-unknown-linux-gnu  # builds the Linux ARM64 .tar.gz (#82)
            name: linux-aarch64
            bin: rudder
          - os: macos-14               # Apple Silicon
            target: aarch64-apple-darwin
            name: macos-aarch64
            bin: rudder
          - os: macos-14               # Apple Silicon runner — cross-compiles the
            target: x86_64-apple-darwin # x86_64 Mac binary. (Dedicated Intel
            name: macos-x86_64          # macos-13 runners queue for ages / time out.)
            bin: rudder

    steps:
      - uses: actions/checkout@v4

      # Slint (winit + femtovg) + rfd (GTK) + arboard need these system libs.
      # Build-time only — no GPU/display required to compile.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
          else
            EXPECTED="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          ACTUAL="$(target/${{ matrix.target }}/release/${{ matrix.bin }} --version)"
          test "$ACTUAL" = "rudder ${EXPECTED}"

      - name: Build AppImage
        if: matrix.name == 'linux-x86_64'
        continue-on-error: true           # don't block the .tar.gz if AppImage fails
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # no FUSE needed in CI
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-appimage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage

          install -Dm755 target/${{ matrix.target }}/release/rudder AppDir/usr/bin/rudder
          install -Dm644 assets/rudder.desktop          AppDir/usr/share/applications/rudder.desktop
          install -Dm644 assets/icon@512.png               AppDir/usr/share/icons/hicolor/512x512/apps/rudder.png

          # --output appimage already invokes the plugin; --plugin appimage is redundant and causes an error
          ./linuxdeploy --appdir AppDir --output appimage

          mv rudder*.AppImage "rudder-${VERSION}-linux-x86_64.AppImage"
          echo "APPIMAGE=rudder-${VERSION}-linux-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="rudder-${VERSION}-${{ matrix.name }}"

          if [ "${{ runner.os }}" = "macOS" ]; then
            # ── Build a proper .app bundle ────────────────────────────────────
            # Without a bundle macOS opens raw binaries in Terminal.app, which
            # stays alive after the app exits and never shows a Dock icon.
            APP="rudder.app"
            CONTENTS="$APP/Contents"
            mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

            cp "target/${{ matrix.target }}/release/rudder" "$CONTENTS/MacOS/"
            cp THIRD_PARTY_NOTICES.md "$CONTENTS/Resources/"

            # Generate .icns from the 512×512 PNG using sips + iconutil (both
            # ship with every macOS, no extra tooling needed in CI).
            mkdir -p rudder.iconset
            sips -z 16  16  "assets/icon@512.png" --out rudder.iconset/icon_16x16.png       >/dev/null
            sips -z 32  32  "assets/icon@512.png" --out rudder.iconset/icon_16x16@2x.png    >/dev/null
            sips -z 32  32  "assets/icon@512.png" --out rudder.iconset/icon_32x32.png        >/dev/null
            sips -z 64  64  "assets/icon@512.png" --out rudder.iconset/icon_32x32@2x.png    >/dev/null
            sips -z 128 128 "assets/icon@512.png" --out rudder.iconset/icon_128x128.png     >/dev/null
            sips -z 256 256 "assets/icon@512.png" --out rudder.iconset/icon_128x128@2x.png  >/dev/null
            sips -z 256 256 "assets/icon@512.png" --out rudder.iconset/icon_256x256.png     >/dev/null
            sips -z 512 512 "assets/icon@512.png" --out rudder.iconset/icon_256x256@2x.png  >/dev/null
            sips -z 512 512 "assets/icon@512.png" --out rudder.iconset/icon_512x512.png     >/dev/null
            iconutil -c icns rudder.iconset -o "$CONTENTS/Resources/rudder.icns"

            # Substitute __VERSION__ placeholder (strip leading 'v' from tag)
            VERSION_NUM="${VERSION#v}"
            sed "s/__VERSION__/${VERSION_NUM}/g" assets/Info.plist > "$CONTENTS/Info.plist"

            # Ad-hoc code-sign the assembled bundle.
            # The release profile strips the binary (Cargo.toml: strip = "symbols"),
            # which invalidates the linker's automatic ad-hoc signature — on Apple
            # Silicon that makes the OS refuse to launch it ("app is damaged").
            # Re-signing the whole bundle here restores a valid (ad-hoc) signature,
            # turning the fatal "damaged" error into the normal "unidentified
            # developer" prompt that users can bypass via Open Anyway / xattr.
            codesign --force --deep --sign - "$APP"
            codesign --verify --verbose "$APP"

            # Package with ditto (Apple's tool) — it preserves the bundle's
            # signature and metadata. Plain `zip` mangles them and re-breaks the
            # signature, which would reintroduce the "damaged" error.
            ditto -c -k --keepParent "$APP" "${STAGE}.zip"
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          elif [ "${{ runner.os }}" = "Windows" ]; then
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            7z a "${STAGE}.zip" "$STAGE" >/dev/null
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          else
            # Linux
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            # Ship the desktop entry + installer + icon so the dock shows the icon.
            cp assets/rudder.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
            tar -czf "${STAGE}.tar.gz" "$STAGE"
            echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi

      # MSI installer with a "choose install location" wizard (WixUI_InstallDir).
      # Best-effort: if the WiX/cargo-wix tooling hiccups it must not block the
      # .zip release, hence continue-on-error.
      - name: Build MSI installer (Windows)
        if: matrix.name == 'windows-x86_64' && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-rc')
        continue-on-error: true
        shell: pwsh
        run: |
          $VERSION = "$env:GITHUB_REF_NAME"; if (-not $VERSION) { $VERSION = "dev" }
          # WiX 3 toolset (candle/light) that cargo-wix drives.
          choco install wixtoolset -y --no-progress
          $candle = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($candle) { $env:PATH = "$($candle.DirectoryName);$env:PATH" }
          cargo install cargo-wix --locked
          cargo wix --no-build --nocapture --target ${{ matrix.target }} --output "rudder-$VERSION-windows-x86_64.msi"
          echo "MSI=rudder-$VERSION-windows-x86_64.msi" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Upload AppImage artifact
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-appimage
          path: ${{ env.APPIMAGE }}

      - name: Upload MSI artifact
        if: matrix.name == 'windows-x86_64' && env.MSI != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-msi
          path: ${{ env.MSI }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

      - name: Attach AppImage to GitHub Release
        if: matrix.name == 'linux-x86_64' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APPIMAGE }}
          fail_on_unmatched_files: true

      - name: Attach MSI to GitHub Release
        if: matrix.name == 'windows-x86_64' && env.MSI != '' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MSI }}
          fail_on_unmatched_files: false

  build-linux-aarch64-glibc228:
    name: linux-aarch64-glibc228
    needs: check-version
    runs-on: ubuntu-22.04-arm
    container: debian:10

    steps:
      - name: Prepare Debian 10 build dependencies
        shell: bash
        run: |
          set -eu
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99archive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils file tar \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu-glibc228

      - name: Build (release)
        shell: bash
        run: |
          set -eu
          . "$HOME/.cargo/env"
          rustc --version
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Verify glibc baseline
        shell: bash
        run: |
          set -eu
          ldd --version | sed -n '1p'
          file target/aarch64-unknown-linux-gnu/release/rudder
          objdump -T target/aarch64-unknown-linux-gnu/release/rudder \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -n 10 || true

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="rudder-${VERSION}-linux-aarch64-glibc228"

          mkdir "$STAGE"
          cp "target/aarch64-unknown-linux-gnu/release/rudder" "$STAGE/"
          cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
          cp assets/rudder.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64-glibc228
          path: ${{ env.ASSET }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

  build-linux-x86_64-glibc228:
    name: linux-x86_64-glibc228
    needs: check-version
    runs-on: ubuntu-22.04
    container: debian:10

    steps:
      - name: Prepare Debian 10 build dependencies
        shell: bash
        run: |
          set -eu
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99archive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils file tar \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu-glibc228

      - name: Build (release)
        shell: bash
        run: |
          set -eu
          . "$HOME/.cargo/env"
          rustc --version
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Verify glibc baseline
        shell: bash
        run: |
          set -eu
          ldd --version | sed -n '1p'
          file target/x86_64-unknown-linux-gnu/release/rudder
          objdump -T target/x86_64-unknown-linux-gnu/release/rudder \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -n 10 || true

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME:-dev}"
          STAGE="rudder-${VERSION}-linux-x86_64-glibc228"

          mkdir "$STAGE"
          cp "target/x86_64-unknown-linux-gnu/release/rudder" "$STAGE/"
          cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
          cp assets/rudder.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-glibc228
          path: ${{ env.ASSET }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
