name: Release

# Build native binaries for Windows / Linux / macOS.
#  - Push a tag like `v0.2.3`  -> builds all platforms and attaches the archives
#    to a GitHub Release.
#  - Run manually (workflow_dispatch) -> builds all platforms and uploads them as
#    downloadable workflow artifacts (no release created).
#
# ⚠️ 手动触发时 GITHUB_REF_NAME 是**分支名**，可能带 `/`（如 exp/renderer-wgpu-vulkan）——
#    直接拼进打包路径会让 `mkdir rudder-exp/renderer-…` 失败（父目录不存在），
#    所以每处 `VERSION=` 都先把 `/` 换成 `-`。打 tag 时这条是空操作。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create / update the GitHub Release

env:
  # macOS 镜像与 Xcode（两处 macOS 作业共用，改这里即可）。
  # 跑在 `macos-26`（= 当前的 `macos-latest`，macOS 26 Arm64）上，镜像自带
  # Xcode 26.0.1 / 26.1.1 / 26.2 / 26.3 / 26.4.1 / 26.5 / **26.6**（默认）。
  # 显式选定，免得将来镜像换默认版本时构建悄悄变味。
  #
  # ⚠️ **不要切到 macOS 27**：它的 dyld 校验更严，会拒收 release 档 proc-macro 的
  #   `.dylib`（`mis-aligned LINKEDIT string pool`，旧 rustc 产出的布局），构建会死在
  #   `slint` 上（`can't find crate for slint_macros`）。Rust 1.98.1 起已缓解，
  #   但镜像本身也还没 GA —— 等它 GA 且实测通过再切。
  MACOS_XCODE: Xcode_26.6

jobs:
  check-version:
    name: Check tag version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Ensure tag matches Cargo package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -eu
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          LOCK_VERSION="$(awk '
            $0 == "name = \"rudder\"" { found = 1; next }
            found && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.lock)"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}."
            echo "Run: pwsh ./scripts/release.ps1 ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$LOCK_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.lock rudder version ${LOCK_VERSION}."
            echo "Run: pwsh ./scripts/release.ps1 ${GITHUB_REF_NAME}"
            exit 1
          fi

  quality:
    name: Test + lint gate
    needs: check-version
    # Pin to the same Ubuntu the Linux release builds use: the gate must run in
    # the environment we actually ship from (Ubuntu 24.04 since 2026-09-21).
    # ⚠️ `yeslogic-fontconfig-sys`（fontdb 的链接层）要 `libfontconfig1-dev`，而 24.04
    #    镜像**没有预装** —— 所以下面那步 "Install Linux GUI dependencies" 是必需的，
    #    别删：历史上就是漏装它把本作业打红（#ci-quality-deps）。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Same dependency set as the Linux build jobs below (kept in sync by
      # hand — Actions has no YAML anchors): clippy/test compile every
      # build-script, so any missing -dev package redlines the gate
      # (#ci-quality-deps: fontconfig, then libudev).
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Lock to the same toolchain the release builds use — newer stables
          # keep adding lints and would redline the gate independently of the
          # shipped code (#ci-quality-toolchain).
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # fmt --check intentionally omitted: the tree has ~99 pre-existing
      # formatting diffs (fmt was never run historically). Enabling the gate
      # now would redline CI; formatting the whole tree is tracked separately.
      - name: cargo clippy -D warnings
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test --release
        run: cargo test --release

  build:
    name: ${{ matrix.name }}
    needs: [check-version, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026      # VS2026 toolchain, same generation as
            target: x86_64-pc-windows-msvc  # the ARM64 image below so both
            name: windows-x86_64                 # Windows builds compile alike
            bin: rudder.exe
            arch: x64
            upgrade-code: 6E8F2A1B-3C4D-4E5F-9A0B-1C2D3E4F5A6B
          - os: windows-11-vs2026-arm    # native Windows on ARM64 runner (free for
            target: aarch64-pc-windows-msvc  # public repos). The -vs2026 image is
            # chosen deliberately: plain `windows-11-arm` switches to the VS2026
            # toolchain on 2026-09-21, so building on it now means we hit any
            # MSVC breakage on our own schedule instead of mid-release.
            name: windows-aarch64
            bin: rudder.exe
            arch: arm64
            # Distinct from x86_64: sharing one upgrade code risks a
            # cross-architecture upgrade match.
            upgrade-code: 9C4E7B21-5D8A-4F3B-B2E1-7A6D5C4F3E2B
          - os: ubuntu-24.04            # 主力 Linux 构建（2026-09-21 起从 22.04 上移）
            target: x86_64-unknown-linux-gnu   # ⚠️ glibc 底线随之抬到 2.39；需要更老
            name: linux-x86_64                 # 发行版的用户请用 `*-glibc228` 变体
            bin: rudder
          - os: ubuntu-24.04-arm       # free native arm64 runner (public repos)
            target: aarch64-unknown-linux-gnu  # builds the Linux ARM64 .tar.gz (#82)
            name: linux-aarch64
            bin: rudder
          - os: macos-26               # Apple Silicon, macOS 26（见顶部 env 的说明）
            target: aarch64-apple-darwin
            name: macos-aarch64
            bin: rudder
          - os: macos-26               # Apple Silicon runner — cross-compiles the
            target: x86_64-apple-darwin # x86_64 Mac binary. (Dedicated Intel
            name: macos-x86_64          # runners queue for ages / time out.)
            bin: rudder

    steps:
      - uses: actions/checkout@v5

      # 固定链接器用的 Xcode（见顶部 `MACOS_XCODE`）。构建用的 cc/ld 由它决定，
      # 所以必须在 `Build` 之前选好；顺手打印版本，日志里能对上。
      - name: Select Xcode
        if: runner.os == 'macOS'
        run: |
          set -eu
          sudo xcode-select -s "/Applications/${MACOS_XCODE}.app"
          xcodebuild -version
          clang --version | head -n 1

      # Slint (winit + femtovg) + rfd (GTK) + arboard need these system libs.
      # Build-time only — no GPU/display required to compile.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify binary version
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
          else
            EXPECTED="$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          ACTUAL="$(target/${{ matrix.target }}/release/${{ matrix.bin }} --version)"
          test "$ACTUAL" = "rudder ${EXPECTED}"

      - name: Cache linuxdeploy
        if: matrix.name == 'linux-x86_64'
        uses: actions/cache@v5
        with:
          path: |
            linuxdeploy
            linuxdeploy-plugin-appimage
          key: linuxdeploy-2024

      - name: Build AppImage
        if: matrix.name == 'linux-x86_64'
        continue-on-error: true           # don't block the .tar.gz if AppImage fails
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"   # no FUSE needed in CI
        run: |
          set -eu
          VERSION="$(printf '%s' "${GITHUB_REF_NAME:-dev}" | tr '/' '-')"
          wget -q -O linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q -O linuxdeploy-plugin-appimage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-appimage

          install -Dm755 target/${{ matrix.target }}/release/rudder AppDir/usr/bin/rudder
          install -Dm644 assets/rudder.desktop          AppDir/usr/share/applications/rudder.desktop
          install -Dm644 assets/icon@512.png               AppDir/usr/share/icons/hicolor/512x512/apps/rudder.png

          # --output appimage already invokes the plugin; --plugin appimage is redundant and causes an error
          ./linuxdeploy --appdir AppDir --output appimage

          mv rudder*.AppImage "rudder-${VERSION}-linux-x86_64.AppImage"
          echo "APPIMAGE=rudder-${VERSION}-linux-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="$(printf '%s' "${GITHUB_REF_NAME:-dev}" | tr '/' '-')"
          STAGE="rudder-${VERSION}-${{ matrix.name }}"

          if [ "${{ runner.os }}" = "macOS" ]; then
            # ── Build a proper .app bundle ────────────────────────────────────
            # Without a bundle macOS opens raw binaries in Terminal.app, which
            # stays alive after the app exits and never shows a Dock icon.
            APP="rudder.app"
            CONTENTS="$APP/Contents"
            mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

            cp "target/${{ matrix.target }}/release/rudder" "$CONTENTS/MacOS/"
            cp THIRD_PARTY_NOTICES.md "$CONTENTS/Resources/"

            # Generate .icns from the 512×512 PNG using sips + iconutil (both
            # ship with every macOS, no extra tooling needed in CI).
            mkdir -p rudder.iconset
            sips -z 16  16  "assets/icon@512.png" --out rudder.iconset/icon_16x16.png       >/dev/null
            sips -z 32  32  "assets/icon@512.png" --out rudder.iconset/icon_16x16@2x.png    >/dev/null
            sips -z 32  32  "assets/icon@512.png" --out rudder.iconset/icon_32x32.png        >/dev/null
            sips -z 64  64  "assets/icon@512.png" --out rudder.iconset/icon_32x32@2x.png    >/dev/null
            sips -z 128 128 "assets/icon@512.png" --out rudder.iconset/icon_128x128.png     >/dev/null
            sips -z 256 256 "assets/icon@512.png" --out rudder.iconset/icon_128x128@2x.png  >/dev/null
            sips -z 256 256 "assets/icon@512.png" --out rudder.iconset/icon_256x256.png     >/dev/null
            sips -z 512 512 "assets/icon@512.png" --out rudder.iconset/icon_256x256@2x.png  >/dev/null
            sips -z 512 512 "assets/icon@512.png" --out rudder.iconset/icon_512x512.png     >/dev/null
            iconutil -c icns rudder.iconset -o "$CONTENTS/Resources/rudder.icns"

            # Substitute __VERSION__ placeholder (strip leading 'v' from tag)
            VERSION_NUM="${VERSION#v}"
            sed "s/__VERSION__/${VERSION_NUM}/g" assets/Info.plist > "$CONTENTS/Info.plist"

            # Ad-hoc code-sign the assembled bundle.
            # The release profile strips the binary (Cargo.toml: strip = "symbols"),
            # which invalidates the linker's automatic ad-hoc signature — on Apple
            # Silicon that makes the OS refuse to launch it ("app is damaged").
            # Re-signing the whole bundle here restores a valid (ad-hoc) signature,
            # turning the fatal "damaged" error into the normal "unidentified
            # developer" prompt that users can bypass via Open Anyway / xattr.
            codesign --force --deep --sign - "$APP"
            codesign --verify --verbose "$APP"

            # Package with ditto (Apple's tool) — it preserves the bundle's
            # signature and metadata. Plain `zip` mangles them and re-breaks the
            # signature, which would reintroduce the "damaged" error.
            ditto -c -k --keepParent "$APP" "${STAGE}.zip"
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          elif [ "${{ runner.os }}" = "Windows" ]; then
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            7z a "${STAGE}.zip" "$STAGE" >/dev/null
            echo "ASSET=${STAGE}.zip" >> "$GITHUB_ENV"

          else
            # Linux
            mkdir "$STAGE"
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGE/"
            cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
            # Ship the desktop entry + installer + icon so the dock shows the icon.
            cp assets/rudder.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
            tar -czf "${STAGE}.tar.gz" "$STAGE"
            echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"
          fi

      # MSI installer with a "choose install location" wizard (WixUI_InstallDir).
      # Best-effort: if the WiX/cargo-wix tooling hiccups it must not block the
      # .zip release, hence continue-on-error.
      # MSI installer, one step for every Windows target. Built with the WiX 4
      # CLI: WiX 3 (which cargo-wix drives) has no ARM64 support, so keeping
      # both architectures on WiX 4 avoids two toolchains and two syntaxes.
      # Best-effort: a toolchain hiccup must not block the .zip asset.
      - name: Build MSI installer (WiX 4)
        if: startsWith(matrix.name, 'windows') && !contains(github.ref, '-beta') && !contains(github.ref, '-alpha') && !contains(github.ref, '-rc')
        continue-on-error: true
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '/', '-'; if (-not $VERSION) { $VERSION = "dev" }
          # WiX's ProductVersion must be numeric: a tag ref still carries the
          # "v" prefix and a workflow_dispatch run has no tag at all
          # (GITHUB_REF_NAME == the branch), so read the real version from
          # Cargo.toml — the single source of truth for both cases.
          $MSI_VERSION = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $MSI_VERSION) { $MSI_VERSION = $VERSION.TrimStart("v") }
          # 仅历史 `-fixN` 标签需要这条映射（WiX 的 ProductVersion 只能是数字）。
          # 新命名 `-betaN` 不产 MSI —— 上面的 `if` 已经把 beta/alpha/rc 排除了，
          # 因为 WiX 表达不了"早于 0.7.9"这种预发布语义。
          # Legacy `-fixN` only: `0.7.7-fix1` → `0.7.7.1`（WiX rejects `-`）。
          $MSI_VERSION = $MSI_VERSION -replace '-fix(\d+)$', '.$1'
          # CLI and extension versions must match: pinning the CLI to 4.x while
          # resolving the extension to 7.0.0 left the cache entry "damaged"
          # (WIX0144). Both are pinned to the same release here.
          dotnet tool install --global wix --version 4.0.6
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix --version
          # `wix build -ext` only resolves an extension, it does not download
          # it — add it (pinned) first, then list for diagnostics.
          wix extension add WixToolset.UI.wixext/4.0.6 --global
          wix extension list --global
          wix build wix\main.wxs `
            -arch "${{ matrix.arch }}" `
            -d Version="$MSI_VERSION" `
            -d CargoTargetBinDir="target\${{ matrix.target }}\release" `
            -d UpgradeCode="${{ matrix.upgrade-code }}" `
            -ext WixToolset.UI.wixext `
            -out "rudder-$VERSION-${{ matrix.name }}.msi"
          echo "MSI=rudder-$VERSION-${{ matrix.name }}.msi" >> $env:GITHUB_ENV

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

      - name: Upload AppImage artifact
        if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v6
        with:
          name: linux-x86_64-appimage
          path: ${{ env.APPIMAGE }}

      - name: Upload MSI artifact
        if: startsWith(matrix.name, 'windows') && env.MSI != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-msi
          path: ${{ env.MSI }}

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}
          # 发布页的说明 = tag 里那份 CHANGELOG 的该版本段落（中英对照，手写）。
          # 每个平台作业都写一次是幂等的：谁先跑完谁建 Release，内容都一样；
          # 没有该版本段落时读进来是空文件，等同于不写说明（与以前一致）。
          body_path: notes.md
          fail_on_unmatched_files: true
          # 只有 beta/alpha/rc 是预发布；`-fixN` 补丁版必须是正式 release：
          # 更新检查读 `/releases/latest`，该接口默认排除预发布，标成 prerelease
          # 等于用户永远收不到补丁版。
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}

      - name: Release notes from CHANGELOG
        if: matrix.name == 'linux-x86_64' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md

      - name: Attach AppImage to GitHub Release
        if: matrix.name == 'linux-x86_64' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.APPIMAGE }}
          # 发布页的说明 = tag 里那份 CHANGELOG 的该版本段落（中英对照，手写）。
          # 每个平台作业都写一次是幂等的：谁先跑完谁建 Release，内容都一样；
          # 没有该版本段落时读进来是空文件，等同于不写说明（与以前一致）。
          body_path: notes.md
          fail_on_unmatched_files: true
          # 只有 beta/alpha/rc 是预发布；`-fixN` 补丁版必须是正式 release：
          # 更新检查读 `/releases/latest`，该接口默认排除预发布，标成 prerelease
          # 等于用户永远收不到补丁版。
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}

      - name: Release notes from CHANGELOG
        if: startsWith(matrix.name, 'windows') && env.MSI != '' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md

      - name: Attach MSI to GitHub Release
        if: startsWith(matrix.name, 'windows') && env.MSI != '' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.MSI }}
          # 发布页的说明 = tag 里那份 CHANGELOG 的该版本段落（中英对照，手写）。
          # 每个平台作业都写一次是幂等的：谁先跑完谁建 Release，内容都一样；
          # 没有该版本段落时读进来是空文件，等同于不写说明（与以前一致）。
          body_path: notes.md
          fail_on_unmatched_files: false
          # 只有 beta/alpha/rc 是预发布；`-fixN` 补丁版必须是正式 release：
          # 更新检查读 `/releases/latest`，该接口默认排除预发布，标成 prerelease
          # 等于用户永远收不到补丁版。
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}

  build-linux-aarch64-glibc228:
    name: linux-aarch64-glibc228
    needs: check-version
    runs-on: ubuntu-24.04-arm
    container: debian:10

    steps:
      - name: Prepare Debian 10 build dependencies
        shell: bash
        run: |
          set -eu
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99archive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils file tar \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgtk-3-dev \
            libudev-dev

      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.96.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-unknown-linux-gnu-glibc228

      - name: Build (release)
        shell: bash
        run: |
          set -eu
          . "$HOME/.cargo/env"
          rustc --version
          cargo build --release --target aarch64-unknown-linux-gnu

      - name: Verify glibc baseline
        shell: bash
        run: |
          set -eu
          ldd --version | sed -n '1p'
          file target/aarch64-unknown-linux-gnu/release/rudder
          objdump -T target/aarch64-unknown-linux-gnu/release/rudder \
            | grep -o 'GLIBC_[0-9.]*' \
            | sort -Vu \
            | tail -n 10 || true

      - name: Package
        shell: bash
        run: |
          set -eu
          VERSION="$(printf '%s' "${GITHUB_REF_NAME:-dev}" | tr '/' '-')"
          STAGE="rudder-${VERSION}-linux-aarch64-glibc228"

          mkdir "$STAGE"
          cp "target/aarch64-unknown-linux-gnu/release/rudder" "$STAGE/"
          cp README.md README.en.md CHANGELOG.md THIRD_PARTY_NOTICES.md "$STAGE/" 2>/dev/null || true
          cp assets/rudder.desktop assets/install-linux.sh "assets/icon@512.png" "$STAGE/" 2>/dev/null || true
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-aarch64-glibc228
          path: ${{ env.ASSET }}

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > notes.md

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}
          # 发布页的说明 = tag 里那份 CHANGELOG 的该版本段落（中英对照，手写）。
          # 每个平台作业都写一次是幂等的：谁先跑完谁建 Release，内容都一样；
          # 没有该版本段落时读进来是空文件，等同于不写说明（与以前一致）。
          body_path: notes.md
          fail_on_unmatched_files: true
          # 只有 beta/alpha/rc 是预发布；`-fixN` 补丁版必须是正式 release：
          # 更新检查读 `/releases/latest`，该接口默认排除预发布，标成 prerelease
          # 等于用户永远收不到补丁版。
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}

  build-linux-x86_64-glibc228:
    name: linux-x86_64-glibc228
    needs: check-version
    runs-on: ubuntu-24.04
    container: debian:10

    steps:
      - name: Prepare Debian 10 build dependencies
        shell: bash
        run: |
          set -eu
          sed -i \
            -e 's|deb.debian.org/debian|archive.debian.org/debian|g' \
            -e 's|security.debian.org/debian-security|archive.debian.org/debian-security|g' \
            -e '/buster-updates/d' \
            /etc/apt/sources.list
          printf 'Acquire::Check-Valid-Until "false";\n' > /etc/apt/apt.conf.d/99archive

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils file tar \
            build-essential pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
