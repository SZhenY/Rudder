          # 没有该版本段落时读进来是空文件，等同于不写说明（与以前一致）。
          body_path: notes.md
          fail_on_unmatched_files: true
          # 只有 beta/alpha/rc 是预发布；`-fixN` 补丁版必须是正式 release：
          # 更新检查读 `/releases/latest`，该接口默认排除预发布，标成 prerelease
