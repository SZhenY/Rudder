name: 功能建议 / Feature request
description: 建议新功能或改进现有体验
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 MeatShell！提交前请先搜索现有 Issue，避免重复建议。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 请说明你遇到的需求或当前使用方式中的不便。
      placeholder: 当我……时，希望能够……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 请描述你希望 MeatShell 如何实现或改进。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
      description: 如果你尝试过其他解决方式，或有不同实现思路，可以在这里补充。

  - type: textarea
    id: additional_context
    attributes:
      label: 其他补充
      description: 可添加截图、示意图或其他有助于理解建议的信息。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同或高度相似的建议。
          required: true
